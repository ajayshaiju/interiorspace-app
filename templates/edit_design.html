{% extends "base.html" %}

{% block title %}
Edit Design | InteriorSpace
{% endblock %}

{% block content %}

<section class="admin-page">

    <div class="admin-container">

        <div class="admin-header">
            <p class="section-label">Administration</p>
            <h1>Edit Interior Design</h1>
        </div>

        <section class="admin-form-card">

            <form method="post">

                <div class="form-group">
                    <label for="title">Design title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        value="{{ design.title }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select
                        id="category"
                        name="category"
                        required
                    >
                        <option value="Living Room"
                            {% if design.category == "Living Room" %}selected{% endif %}>
                            Living Room
                        </option>

                        <option value="Bedroom"
                            {% if design.category == "Bedroom" %}selected{% endif %}>
                            Bedroom
                        </option>

                        <option value="Kitchen"
                            {% if design.category == "Kitchen" %}selected{% endif %}>
                            Kitchen
                        </option>

                        <option value="Office"
                            {% if design.category == "Office" %}selected{% endif %}>
                            Office
                        </option>

                        <option value="Bathroom"
                            {% if design.category == "Bathroom" %}selected{% endif %}>
                            Bathroom
                        </option>

                        <option value="Dining Room"
                            {% if design.category == "Dining Room" %}selected{% endif %}>
                            Dining Room
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        required
                    >{{ design.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="image">Image filename</label>

                    <input
                        type="text"
                        id="image"
                        name="image"
                        value="{{ design.image }}"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Update Design
                </button>

                <a
                    href="{{ url_for('admin') }}"
                    class="btn"
                >
                    Cancel
                </a>

            </form>

        </section>

    </div>

</section>

{% endblock %}
